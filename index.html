<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webpage Week4 </title>

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="hero">
        <h1>Student Practice Webpage</h1>
        <p>HTML + CSS Practice(Form + Table Advanced)</p>
    </header>

    <section class="card">
        <h2>Image Section</h2>
        <img class="image-preview" src="images/angkor.jpg" alt="AngKor picture">
    </section>

    <section class="card">
        <h2>Image Circle</h2>
        <img class="image-circle" src="images/angkor.jpg" alt="AngKor picture">
    </section>

    <section class="card">
        <h2>Image Oval</h2>
        <img class="image-oval" src="images/angkor.jpg" alt="AngKor picture">
    </section>

    <section class="card">
        <h2>Advanced Table</h2>
        <table class="table">
            <thead>
                <tr>
                    <th rowspan="2">Name</th>
                    <th colspan="2">Scores</th>
                    <th rowspan="2">Grade</th>
                </tr>
                <tr>
                    <th>Math</th>
                    <th>Cs</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Alice</td>
                    <td>90</td>
                    <td>95</td>
                    <td>A</td>
                </tr>
                <tr>
                    <td>Bob</td>
                    <td>80</td>
                    <td>85</td>
                    <td>B</td>
                </tr>
            </tbody>
        </table>
    </section>

    <section class="card form-container">
        <h2>Form 1: Basic Info</h2>
        <form>
            <div class="form-group">
                <label for="name">
                    Name<span class="required">*</span>
                </label>
                <input class="form-control" type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="email">
                    Email<span class="required">*</span>
                </label>
                <input class="form-control" type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="password">
                    Password<span class="required">*</span>
                </label>
                <input class="form-control" type="password" id="password" name="password" required>
            </div>
            <div class="form-group">
                <label for="file">Upload File</label>
                <input class="form-control" type="file" id="file" name="file">
            </div>

            <input class="btn" type="submit" value="Submit">
            <input class="btn" type="reset" value="Reset">
        </form>
    </section>

    <section class="card form-container">
        <h2>Form 2: Survey Form</h2>
        <form>
            <div class="form-group">
                <label for="course">
                    Choose Course<span class="required">*</span>
                </label>
                <select class="form-control" id="course" name="course" required>
                    <option value="">--Select a course--</option>
                    <option value="course1">Course 1</option>
                    <option value="course2">Course 2</option>
                    <option value="course3">Course 3</option>
                </select>
            </div>
            <div class="form-group">
                <label>Gender</label>
                <div class="inline-group inline-item-parents">
                    <div class="inline-item">
                        <input type="radio" id="male" name="gender">
                        <label for="male">Male</label>
                    </div>
                    <div class="inline-item">
                        <input type="radio" id="female" name="gender">
                        <label for="female">Female</label>
                    </div>
                </div>
            </div>
            <div class="form-group">
                <label>Skills</label>
                <div class="inline-group">
                    <div class="inline-item-parents">
                        <div class="inline-item">
                            <input type="checkbox" id="html">
                            <label for="html">HTML</label>
                        </div>

                        <div class="inline-item">
                            <input type="checkbox" id="css">
                            <label for="css">CSS</label>
                        </div>

                        <div class="inline-item">
                            <input type="checkbox" id="js">
                            <label for="js">JavaScript</label>
                        </div>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="phone">
                    Phone<span class="required">*</span>
                </label>
                <input class="form-control" type="tel" id="phone" name="phone" required>
            </div>
            <div class="form-group">
                <label for="message">Message</label><br>
                <textarea class="form-control" id="message" name="message" rows="4"></textarea><br><br>
                <input class="btn" type="submit" value="Submit" required>
            </div>
        </form>
    </section>
</body>

</html>
